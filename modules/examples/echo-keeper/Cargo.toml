[package]
name = "echo-keeper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example keeper paired with the echo-venue adapter: drives it through the typed VenueClient emitted by #[videre_sdk::keeper] - quote, submit, status, cancel - and logs the intent-status transitions the registry fans back."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "6f0e3558039abe928cc19d7ce7da13fc2275533e" }
videre-sdk = { path = "../../../crates/videre-sdk" }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }
