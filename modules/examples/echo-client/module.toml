# echo-client module manifest - the keeper half of the echo pair. It
# submits through videre:venue/client and observes intent-status, so it
# declares the `client` capability alongside `logging`; the per-module world
# the macro derives imports exactly videre:venue/client and
# nexum:host/logging.

[module]
name = "echo-client"
version = "0.1.0"

[capabilities]
# `client` grants the videre:venue/client import; `logging` the log sink.
required = ["client", "logging"]
optional = []

[capabilities.http]
allow = []

# Submit on every chain-1 block.
[[subscription]]
kind     = "block"
chain_id = 1

# Observe the status transitions the registry polls from the echo-venue adapter.
[[subscription]]
kind  = "intent-status"
venue = "echo-venue"

[config]
name = "echo-client"

# The one body-schema version this keeper encodes; install refuses the
# keeper unless every installed adapter's [venue] body_versions
# contains it.
[venue]
body_version = 1
