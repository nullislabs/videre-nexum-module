[package]
name = "echo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module paired with the echo-venue adapter: submits an opaque body through videre:venue/client on every block and logs the intent-status transitions the registry fans back."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "17005ba50466e18a64b2f145544c75198549d8a1" }
tracing = { version = "0.1", default-features = false }
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }
