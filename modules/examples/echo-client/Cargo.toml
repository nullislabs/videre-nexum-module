[package]
name = "echo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module paired with the echo-venue adapter: submits an opaque body through videre:venue/client on every block and logs the intent-status transitions the registry fans back."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2085cd2dfb39ac45ffcb9fbfd19a7d44faeda433" }
# The venue status-body codec the `on_extension` handler decodes an
# intent-status transition through, reached via `videre_sdk::status_body`.
videre-sdk = { path = "../../../crates/videre-sdk" }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }
