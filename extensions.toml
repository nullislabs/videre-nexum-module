# Extension capability registry for this composition root: the
# per-namespace rows the component world synthesis emits beyond the core
# nexum:host table. `nexum_world::manifest_extensions` reads this file.
# Each table key is a name a component declares in its `[dependencies]`
# table. Each row names the WIT import that declaration turns into, and
# the package directories its resolve path needs, in dependency order.
# The runtime supplies the `nexum-host` package, so do not list it here.

[extensions.client]
import = "videre:venue/client@0.1.0"
packages = ["videre-value-flow", "videre-types", "videre-venue"]
