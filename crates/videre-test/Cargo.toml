[package]
name = "videre-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformance kit for venue adapters: file-published borsh codec round-trip vectors, header-derivation golden fixtures, and an in-memory MockTransport for adapter unit tests."

[lib]
# Plain library: a venue crate lists it under [dev-dependencies], so the
# kit stays out of the venue's own dependency graph.

[lints]
workspace = true

[dependencies]
# The reference schema's payload structs derive the borsh traits, the
# same way a real venue's payload types do.
borsh.workspace = true
# Vector and golden files carry byte fields as lowercase hex so a
# non-Rust author can read them without a borsh decoder.
hex.workspace = true
# `MockFetch` speaks the standard `http` request/response types the
# SDK's `Fetch` seam is expressed in.
http.workspace = true
# Transport seam vocabulary: the `ChainHost` and `Fetch` seams the mocks
# implement.
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf" }
# `MockChain` is composed rather than reimplemented: one chain mock
# serves both personas.
nexum-sdk-test = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf" }
# The contract under test: `IntentBody`, `BodyError`, and the intent
# header types.
videre-sdk = { path = "../videre-sdk" }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
