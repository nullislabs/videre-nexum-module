[package]
name = "videre-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The videre venue platform as one nexum-runtime extension: the venue-adapter provider kind, the venue registry service, the advisory egress-guard seam, and the videre:venue/client interface."

[lints]
workspace = true

[dependencies]
# The runtime seam this crate plugs into; the only nexum crate edge.
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "db39b6c1959a2b8a304f4df8f014f87b4999d653" }
# Encoder for the opaque status body the host event stream carries; the
# registry lowers an adapter-reported status through it.
videre-status-body = { path = "../videre-status-body" }

wasmtime.workspace = true
# `HostWallClock` is the registry's clock seam: the runtime hands the
# launch clock through `Extension::attach_clock`, so one timeline drives
# ledger and guests.
wasmtime-wasi.workspace = true
# `keccak256` body digests keying the quote ledger behind the registry's
# staleness check.
alloy-primitives.workspace = true
anyhow.workspace = true
derive_more.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[features]
# Test-only helpers: the direct `VenueRegistry::install_for_test` seam, so an
# out-of-crate test installs a mock adapter without the provider boot path.
# Off by default; the self dev-dependency below turns it on for this crate's
# own tests.
test-utils = []

[dev-dependencies]
# Self dev-dependency enabling `test-utils` for this crate's own test targets,
# so `cargo test -p videre-host` sees `install_for_test` without every
# invocation passing `--features test-utils`.
videre-host = { path = ".", features = ["test-utils"] }
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "db39b6c1959a2b8a304f4df8f014f87b4999d653", features = ["test-utils"] }
nexum-tasks = { git = "https://github.com/nullislabs/nexum-runtime", rev = "db39b6c1959a2b8a304f4df8f014f87b4999d653" }
tempfile.workspace = true
